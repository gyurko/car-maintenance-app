name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Keep content below the status bar (opt out of forced edge-to-edge)
        run: |
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>' android/app/src/main/res/values/styles.xml
          cat android/app/src/main/res/values/styles.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk car-log.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Car Log build ${{ github.run_number }}
          files: car-log.apk
